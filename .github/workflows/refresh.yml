name: Refresh event calendar

on:
  schedule:
    # 13:00 UTC = 8:00am Central during CDT (spring/summer).
    # GitHub cron is UTC and ignores daylight saving, so in winter (CST)
    # this lands at 7:00am. Change to "0 14 * * 1" if you want 8am in winter.
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Also send a test email to rutvi only"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install python-dateutil

      - name: Generate the calendar
        run: python update_calendar.py

      - name: Copy generated files to the repo root
        run: cp output/* .

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.csv events.json index.html priority_events.csv source_debug.json source_report.html zcyber_security_events.ics
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Auto-refresh event calendar"
            git push
          fi

      - name: Email the calendar link
        if: github.event_name == 'schedule' || github.event.inputs.test_email == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
        run: |
          if [ "$TEST_EMAIL" = "true" ]; then
            RECIPIENTS='["rutvi@ztekcyber.com"]'
          else
            RECIPIENTS='["neal@ztekcyber.com","jai@ztekcyber.com","jason@ztekcyber.com"]'
          fi
          PAYLOAD="{\"from\":\"Z Cyber GTM <rutvi@ztekcyber.com>\",\"to\":$RECIPIENTS,\"subject\":\"Z Cyber security event radar: updated for the week\",\"html\":\"The security event radar refreshed for the week. Calendar: https://rutvigtm.github.io/zcyber-event-calendar/\"}"
          curl -sS -X POST https://api.resend.com/emails -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" -d "$PAYLOAD"
