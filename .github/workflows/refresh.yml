name: Deploy event calendar

# ============================================================================
# Generation now happens on Rutvi's Mac (residential IP reaches Eventbrite, so
# the full ~371-event list is produced). The Mac commits + pushes the generated
# files. This workflow ONLY deploys the pushed files to GitHub Pages and emails
# the team. It does not generate anything.
#
# ONE-TIME SETUP (required):
#   Repo Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions".
#   (Replaces the old "Deploy from a branch" path that kept flaking on deploy.)
# ============================================================================

on:
  # Runs when the Mac pushes a refreshed calendar (any output file changes).
  push:
    branches: [main]
    paths:
      - "events.json"
      - "index.html"
      - "events.csv"
      - "priority_events.csv"
      - "source_debug.json"
      - "source_report.html"
      - "zcyber_security_events.ics"
  # Manual deploy / catch-up. Set send_team_email to also notify the team.
  workflow_dispatch:
    inputs:
      send_team_email:
        description: "Also email the team the calendar link"
        type: boolean
        default: false
      test_email:
        description: "Send a test email to rutvi only (overrides team email)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys wedge each other.
concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed calendar
        uses: actions/checkout@v4

      - name: Assemble the site directory
        run: |
          mkdir -p _site
          cp index.html events.csv events.json priority_events.csv \
             source_debug.json source_report.html zcyber_security_events.ics _site/
          touch _site/.nojekyll

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_attempt_1.outputs.page_url }}
    outputs:
      deployed: ${{ steps.deploy_attempt_1.outcome == 'success' || steps.deploy_attempt_2.outcome == 'success' }}
    steps:
      # deploy-pages hits an intermittent "Deployment failed, try again later"
      # backend error. Try, wait, retry in the SAME run so it self-heals instead
      # of needing a manual "re-run all jobs".
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy_attempt_1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy_attempt_2
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    # Email once the site is actually live. On a Mac push, notify the team.
    # On a manual run, only email if asked.
    if: >
      needs.deploy.outputs.deployed == 'true' &&
      ( github.event_name == 'push' ||
        github.event.inputs.send_team_email == 'true' ||
        github.event.inputs.test_email == 'true' )
    steps:
      - name: Email the calendar link
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
        run: |
          if [ "$TEST_EMAIL" = "true" ]; then
            RECIPIENTS='["rutvi@ztekcyber.com"]'
          else
            RECIPIENTS='["neal@ztekcyber.com","jai@ztekcyber.com","jason@ztekcyber.com"]'
          fi
          PAYLOAD="{\"from\":\"Z Cyber GTM <rutvi@ztekcyber.com>\",\"to\":$RECIPIENTS,\"subject\":\"Z Cyber security event radar: updated for the week\",\"html\":\"The security event radar refreshed for the week. Calendar: https://rutvigtm.github.io/zcyber-event-calendar/\"}"
          curl -sS -X POST https://api.resend.com/emails -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" -d "$PAYLOAD"
